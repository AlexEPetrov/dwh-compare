# Какие таблицы проверять.
# Поля не перечисляются: в MD5 всё, кроме ignore (config.yaml).
#
# keys — бизнес-ключ матчинга (не PK). Если PK = rid/id и он в ignore,
# без keys будет MD5-only (наборы хешей, без diff по полям одной строки).

tables:
  - schema: mart
    table: orders
    enabled: true
    keys:
      - order_nk
    date_column: created_at
    # ignore_columns:
    #   - ingest_ts

  - schema: mart
    table: customers
    enabled: true
    keys:
      - customer_nk
    date_column: modified_at

  - schema: raw
    table: payments
    enabled: false
    keys:
      - payment_id
      - provider
    date_column: created_at
